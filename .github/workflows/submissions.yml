name: Prepare approved submission
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Approved submission issue number
        required: true
permissions:
  contents: write
  pull-requests: write
  issues: read
concurrency:
  group: submission-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false
jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
    steps:
      - name: Require maintainer permission
        env:
          ACTOR: ${{ github.actor }}
        run: |
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)
          case "$permission" in admin|maintain|write) ;; *) exit 1 ;; esac
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Skip existing submission branch
        id: existing
        run: |
          if git ls-remote --exit-code --heads origin "codex/submission-$ISSUE_NUMBER" >/dev/null; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.existing.outputs.exists != 'true'
        run: |
          npm ci
          node scripts/import-submission.mjs
          npm run build
          npm run check:localization
          npm test
          git checkout -b "codex/submission-$ISSUE_NUMBER"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          git commit -m "Add community submission #$ISSUE_NUMBER"
          git push origin "codex/submission-$ISSUE_NUMBER"
      - name: Open review PR if missing
        run: |
          branch="codex/submission-$ISSUE_NUMBER"
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state all --json number --jq length)
          if [ "$existing" = 0 ]; then
            printf '收錄網站投稿 #%s。請確認圖片、提示詞、台灣用語及分類；分類、風格及場景沿用投稿者的選擇，可在 data/submissions 的 JSON 調整；舊投稿保留預設分類。\n\n已執行建置、在地化檢查與測試。合併至 main 且 CI 通過後，Hetzner 將自動部署。\n\nCloses #%s\n' "$ISSUE_NUMBER" "$ISSUE_NUMBER" > /tmp/pr-body.md
            gh pr create --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --title "收錄投稿 #$ISSUE_NUMBER" --body-file /tmp/pr-body.md
          fi
